name: integrity

# M1 CI contract (SPEC / M0 brief section 7): a drifted or stale `external/` must fail the
# build. This runs the same `bootstrap.sh --verify-only` gate used locally, plus config
# validation. It deliberately does NOT deploy free5GC — that needs the gtp5g kernel module
# and a conforming ODE, which GitHub runners are not (SPEC ADR-003).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifest-integrity:
    name: manifest.lock integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest.lock is valid JSON with full 40-char SHAs
        run: |
          python3 - <<'PY'
          import json, re, sys
          m = json.load(open("manifest.lock"))
          assert m.get("schema_version") == "1", "unexpected schema_version"
          deps = m["dependencies"]
          assert {d["name"] for d in deps} == {"free5gc", "ueransim", "gtp5g", "open5gs"}, "unexpected dependency set"
          bad = [d["name"] for d in deps if not re.fullmatch(r"[0-9a-f]{40}", d["commit"])]
          if bad:
              sys.exit(f"pins are not full 40-char SHAs: {bad}")
          # A tag or branch as the pin is forbidden — those move, SHAs do not.
          print(f"{len(deps)} dependencies pinned to full SHAs")
          PY

      - name: bootstrap materializes and verifies the pinned SHAs
        run: bash scripts/bootstrap.sh

      - name: verify-only gate passes on the materialized tree
        run: bash scripts/bootstrap.sh --verify-only

      - name: verify-only FAILS on a drifted tree
        run: |
          # Move one upstream off its pin; the gate must reject it.
          git -C external/gtp5g -c advice.detachedHead=false checkout --quiet HEAD~1
          if bash scripts/bootstrap.sh --verify-only; then
            echo "::error::drift was NOT detected — the integrity gate is ineffective"
            exit 1
          fi
          echo "drift correctly rejected"

      - name: external/ must never be tracked
        run: |
          if [ -n "$(git ls-files external/)" ]; then
            echo "::error::files under external/ are tracked by git"
            git ls-files external/ | head
            exit 1
          fi
          echo "external/ is untracked"

  config-lint:
    name: config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every YAML config parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob("deployments/compose/**/*.yaml", recursive=True)
                          + glob.glob("deployments/compose/**/*.yml", recursive=True)
                          + glob.glob("observability/**/*.yml", recursive=True)
                          + glob.glob("observability/**/*.yaml", recursive=True)
                          + glob.glob("ran/config/*.yaml")
                          + glob.glob("deployments/open5gs/**/*.yaml", recursive=True)
                          + glob.glob("deployments/open5gs/**/*.yml", recursive=True)):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e).splitlines()[0]))
          for f, e in bad:
              print(f"::error file={f}::{e}")
          print(f"checked YAML files; {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY

      - name: slice consistency — the modeled slice appears in every plane
        run: |
          # ADR-007: whatever S-NSSAI the UE requests must be advertised by AMF, SMF, NSSF
          # and the gNB. A slice present in one plane but not another is the exact failure
          # that produced "AMF can not select an target AMF by NRF".
          set -e
          cfg=deployments/compose/config
          for sd in $(grep -oE 'sd: 0x[0-9a-fA-F]{6}' $cfg/uecfg*.yaml | grep -oE '[0-9a-fA-F]{6}$' | sort -u); do
            for f in amfcfg smfcfg nssfcfg gnbcfg; do
              grep -qi "$sd" "$cfg/$f.yaml" || { echo "::error::slice $sd missing from $f.yaml"; exit 1; }
            done
            echo "slice $sd present in AMF, SMF, NSSF and gNB config"
          done

      - name: Open5GS slice consistency — every UE slice and DNN exists in every plane
        run: |
          # ADR-010. A UE requesting an S-NSSAI the AMF, NSSF or gNB does not advertise is
          # rejected at registration; a DNN the SMF and UPF have no pool for fails at session
          # establishment. Both fail far from the file that is wrong.
          python3 - <<'PY'
          import glob, sys, yaml
          base = "deployments/open5gs"
          load = lambda f: yaml.safe_load(open(f))
          amf, nssf = load(f"{base}/config/amf.yaml"), load(f"{base}/config/nssf.yaml")
          smf, upf, gnb = load(f"{base}/config/smf.yaml"), load(f"{base}/config/upf.yaml"), load(f"{base}/ran/gnb.yaml")
          norm = lambda sst, sd: (int(sst), int(str(sd), 16) if isinstance(sd, str) else int(sd))
          amf_s = {norm(x["sst"], x["sd"]) for p in amf["amf"]["plmn_support"] for x in p["s_nssai"]}
          nssf_s = {norm(n["s_nssai"]["sst"], n["s_nssai"]["sd"]) for n in nssf["nssf"]["sbi"]["client"]["nsi"]}
          gnb_s = {norm(x["sst"], x["sd"]) for x in gnb["slices"]}
          smf_d = {x.get("dnn") for x in smf["smf"]["session"]}
          upf_d = {x.get("dnn") for x in upf["upf"]["session"]}
          bad = 0
          for f in sorted(glob.glob(f"{base}/ran/ue-*.yaml")):
              for sess in load(f)["sessions"]:
                  sl, dnn = norm(sess["slice"]["sst"], sess["slice"]["sd"]), sess["apn"]
                  for plane, have in (("AMF", amf_s), ("NSSF", nssf_s), ("gNB", gnb_s)):
                      if sl not in have:
                          print(f"::error file={f}::slice {sl} not advertised by {plane}"); bad += 1
                  for plane, have in (("SMF", smf_d), ("UPF", upf_d)):
                      if dnn not in have:
                          print(f"::error file={f}::DNN {dnn!r} has no pool in {plane}"); bad += 1
                  print(f"{f}: slice {sl} DNN {dnn!r} checked in AMF, NSSF, gNB, SMF, UPF")
          sys.exit(1 if bad else 0)
          PY

      - name: shell scripts are syntactically valid
        run: |
          rc=0
          for s in scripts/*.sh scripts/open5gs/*.sh tests/*.sh ci/scripts/*.sh; do
            bash -n "$s" || { echo "::error file=$s::syntax error"; rc=1; }
          done
          # Container entrypoints run under /bin/sh, so they are checked as POSIX sh.
          for s in deployments/open5gs/*.sh deployments/open5gs/ran/*.sh; do
            sh -n "$s" || { echo "::error file=$s::syntax error"; rc=1; }
          done
          exit $rc

      - name: Python tools and exporters compile
        run: |
          python3 -m py_compile tools/kpi-gate/*.py scripts/open5gs/*.py             deployments/open5gs/observability/*.py             && echo "all Python compiles"

  kpi-gate:
    name: KPI gate is defined and effective
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: KPI definitions are structurally valid
        run: |
          # Rejects a missing field, a duplicate id, an unknown operator or severity, and a
          # count/sum gate with no `or vector(0)` fallback (it would fail a healthy system).
          python3 tools/kpi-gate/kpi_gate.py --self-test
          python3 tools/kpi-gate/kpi_gate.py --self-test --defs deployments/open5gs/kpi-gates.json

      - name: every repo-exported metric a gate queries is really exported
        run: |
          # The stub below is built from the gates' own expressions, so it cannot catch a gate
          # querying a metric name nobody emits. Three free5GC gates did exactly that until a
          # live run exposed it. This checks the names against the exporters' source.
          python3 tools/kpi-gate/check_metric_names.py

      - name: gate PASSES a conforming deployment
        run: |
          python3 tools/kpi-gate/stub_prometheus.py 19091 --mode good &
          for _ in $(seq 20); do
            curl -sf "http://127.0.0.1:19091/api/v1/query?query=up" >/dev/null && break
            sleep 0.5
          done
          NO_COLOR=1 python3 tools/kpi-gate/kpi_gate.py --prometheus http://127.0.0.1:19091

      - name: gate FAILS a broken deployment
        run: |
          # The point of the whole job. A gate that has never been seen to reject anything
          # is indistinguishable from one that always passes — the same reasoning as the
          # "verify-only FAILS on a drifted tree" step above.
          python3 tools/kpi-gate/stub_prometheus.py 19092 --mode bad &
          for _ in $(seq 20); do
            curl -sf "http://127.0.0.1:19092/api/v1/query?query=up" >/dev/null && break
            sleep 0.5
          done
          if NO_COLOR=1 python3 tools/kpi-gate/kpi_gate.py --prometheus http://127.0.0.1:19092; then
            echo "::error::the KPI gate PASSED a deployment with 2 NFs down and 1.7 req/s of 5xx"
            exit 1
          fi
          echo "breach correctly rejected"

      - name: an unreachable Prometheus is not a pass
        run: |
          # Exit 2, never 0: a gate that could not run has not verified anything.
          NO_COLOR=1 python3 tools/kpi-gate/kpi_gate.py --prometheus http://127.0.0.1:19099 \
            && { echo "::error::gate passed with no Prometheus"; exit 1; }
          rc=$?
          [ "$rc" = "2" ] || { echo "::error::expected exit 2, got $rc"; exit 1; }
          echo "unreachable Prometheus correctly reported as unverified (exit 2)"

      - name: thresholds are defined in exactly one place
        run: |
          # A second copy of a threshold is a drift bug waiting to happen. Nothing outside
          # the definitions file may hardcode one.
          if grep -rnE '(0\.2 req|>= *20 UEs|p95.*1\.0)' --include='*.sh' --include='*.py' \
               scripts/ tools/ ci/ tests/ 2>/dev/null | grep -v kpi-gates.json; then
            echo "::error::a KPI threshold appears outside deployments/kpi-gates.json"
            exit 1
          fi
          echo "thresholds live only in deployments/kpi-gates.json"
