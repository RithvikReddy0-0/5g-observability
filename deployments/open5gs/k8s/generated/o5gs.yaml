apiVersion: v1
kind: ConfigMap
metadata:
  name: o5gs-obs
  namespace: o5gs
data:
  ue_probe_exporter.py: "#!/usr/bin/env python3\n\"\"\"\nue_probe_exporter.py \u2014 per-slice reachability and latency, measured\
    \ from the UEs themselves.\n\nWHY THIS EXISTS\nStopping every UE abruptly left the core's metrics unchanged: the AMF still\
    \ reported 20 UEs\non the RAN and the UPF still held 20 sessions, because nothing told the core the UEs had\ngone. A KPI\
    \ gate built only on core-side metrics passed with zero working UEs (measured, not\nassumed \u2014 see docs/open5gs.md).\
    \ Liveness has to be observed from the UE side.\n\nEvery INTERVAL seconds this pings the slice's UPF gateway from each\
    \ UE's own PDU-session\ninterface, so every probe crosses the real path: UE TUN -> gNB (GTP-U) -> UPF -> slice TUN.\n\n\
    It runs inside the UE container, started by ue-entrypoint.sh, because the uesimtunN\ninterfaces only exist in that network\
    \ namespace. It never touches the UE processes.\n\nExported per slice:\n    ue_probe_interfaces{slice}        UE interfaces\
    \ holding an address from the slice's pool\n    ue_probe_reachable{slice}         of those, how many answered the last\
    \ round\n    ue_probe_rtt_ms{slice,stat}       min / avg / max round-trip time of the last round\n    ue_probe_rounds_total,\
    \ ue_probe_round_duration_seconds\n\"\"\"\n\nimport os\nimport re\nimport subprocess\nimport threading\nimport time\n\
    from http.server import BaseHTTPRequestHandler, HTTPServer\n\nPORT = int(os.environ.get(\"PORT\", \"9121\"))\nINTERVAL\
    \ = float(os.environ.get(\"INTERVAL\", \"5\"))\nTIMEOUT_S = int(os.environ.get(\"PROBE_TIMEOUT\", \"1\"))\n\n# prefix:gateway:name\
    \ \u2014 the pools from deployments/open5gs/config/smf.yaml\nSLICES = [tuple(s.split(\":\")) for s in\n          os.environ.get(\"\
    SLICE_POOLS\", \"10.45.:10.45.0.1:eMBB 10.46.:10.46.0.1:URLLC\").split()]\n\nADDR_RE = re.compile(r\"^\\d+:\\s+(uesimtun\\\
    d+)\\s+inet\\s+([\\d.]+)/\", re.M)\n# busybox prints \"min/avg/max = a/b/c ms\"; iputils prints \"min/avg/max/mdev = a/b/c/d\
    \ ms\".\n# The first version only matched busybox, and reported 0 reachable UEs while its probes were\n# visibly arriving\
    \ at the UPF.\nRTT_RE = re.compile(r\"= [\\d.]+/([\\d.]+)/[\\d.]+(?:/[\\d.]+)? ms\")\n\nstate = {\"slices\": {}, \"rounds\"\
    : 0, \"duration\": 0.0}\nlock = threading.Lock()\n\n\ndef interfaces():\n    out = subprocess.run([\"ip\", \"-4\", \"\
    -o\", \"addr\", \"show\"], capture_output=True, text=True).stdout\n    return ADDR_RE.findall(out)\n\n\ndef probe_round():\n\
    \    started = time.time()\n    ifaces = interfaces()\n    procs = []\n    for prefix, gw, name in SLICES:\n        for\
    \ dev, ip in ifaces:\n            if ip.startswith(prefix):\n                p = subprocess.Popen([\"ping\", \"-I\", dev,\
    \ \"-c\", \"1\", \"-W\", str(TIMEOUT_S), gw],\n                                     stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\
    \ text=True)\n                procs.append((name, p))\n\n    result = {name: {\"interfaces\": 0, \"reachable\": 0, \"\
    rtts\": []} for _, _, name in SLICES}\n    for name, p in procs:\n        try:\n            out, _ = p.communicate(timeout=TIMEOUT_S\
    \ + 2)\n        except subprocess.TimeoutExpired:\n            p.kill()\n            out = \"\"\n        r = result[name]\n\
    \        r[\"interfaces\"] += 1\n        m = RTT_RE.search(out or \"\")\n        if p.returncode == 0 and m:\n       \
    \     r[\"reachable\"] += 1\n            r[\"rtts\"].append(float(m.group(1)))\n\n    with lock:\n        state[\"slices\"\
    ] = result\n        state[\"rounds\"] += 1\n        state[\"duration\"] = time.time() - started\n\n\ndef loop():\n   \
    \ while True:\n        t0 = time.time()\n        try:\n            probe_round()\n        except Exception as e:     \
    \                   # never let one bad round kill the exporter\n            print(\"probe round failed: %s\" % e, flush=True)\n\
    \        time.sleep(max(0.0, INTERVAL - (time.time() - t0)))\n\n\ndef render():\n    with lock:\n        s = dict(state)\n\
    \    lines = [\n        \"# HELP ue_probe_interfaces UE PDU-session interfaces holding an address from the slice's pool.\"\
    ,\n        \"# TYPE ue_probe_interfaces gauge\",\n        \"# HELP ue_probe_reachable UE interfaces whose probe through\
    \ the UPF succeeded in the last round.\",\n        \"# TYPE ue_probe_reachable gauge\",\n        \"# HELP ue_probe_rtt_ms\
    \ Round-trip time UE -> gNB -> UPF gateway in the last round.\",\n        \"# TYPE ue_probe_rtt_ms gauge\",\n    ]\n \
    \   for _, _, name in SLICES:\n        r = s[\"slices\"].get(name, {\"interfaces\": 0, \"reachable\": 0, \"rtts\": []})\n\
    \        lines.append('ue_probe_interfaces{slice=\"%s\"} %d' % (name, r[\"interfaces\"]))\n        lines.append('ue_probe_reachable{slice=\"\
    %s\"} %d' % (name, r[\"reachable\"]))\n        if r[\"rtts\"]:\n            rt = r[\"rtts\"]\n            for stat, v\
    \ in ((\"min\", min(rt)), (\"avg\", sum(rt) / len(rt)), (\"max\", max(rt))):\n                lines.append('ue_probe_rtt_ms{slice=\"\
    %s\",stat=\"%s\"} %.3f' % (name, stat, v))\n    lines += [\n        \"# HELP ue_probe_rounds_total Probe rounds completed.\"\
    ,\n        \"# TYPE ue_probe_rounds_total counter\",\n        \"ue_probe_rounds_total %d\" % s[\"rounds\"],\n        \"\
    # HELP ue_probe_round_duration_seconds Wall time of the last probe round.\",\n        \"# TYPE ue_probe_round_duration_seconds\
    \ gauge\",\n        \"ue_probe_round_duration_seconds %.3f\" % s[\"duration\"],\n    ]\n    return \"\\n\".join(lines)\
    \ + \"\\n\"\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path.split(\"?\")[0] !=\
    \ \"/metrics\":\n            self.send_response(404)\n            self.end_headers()\n            return\n        body\
    \ = render().encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"text/plain; version=0.0.4\"\
    )\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\
    \n    def log_message(self, *args):\n        pass\n\n\nif __name__ == \"__main__\":\n    print(\"ue_probe_exporter on\
    \ :%d, every %.0fs, slices: %s\"\n          % (PORT, INTERVAL, \", \".join(\"%s via %s\" % (n, g) for _, g, n in SLICES)),\
    \ flush=True)\n    threading.Thread(target=loop, daemon=True).start()\n    HTTPServer((\"0.0.0.0\", PORT), Handler).serve_forever()\n"
  upf_slice_exporter.py: "#!/usr/bin/env python3\n\"\"\"\nupf_slice_exporter.py \u2014 measured, per-slice user-plane traffic\
    \ from the Open5GS UPF.\n\nWHY THIS EXISTS\nOpen5GS's UPF exports traffic volume (fivegs_ep_n3_gtp_{in,out}datavolumeqosleveln3upf),\
    \ but\nthe only label is `qfi`. The default QoS flow of every PDU session is QFI 1 regardless of\nslice, so those counters\
    \ mix eMBB and URLLC traffic together. They cannot answer \"how much\nis each slice carrying\" \u2014 the same R-02 gap\
    \ free5GC had, narrower but still real.\n\nThis deployment gives each slice its own DNN, address pool, UPF and TUN device\n\
    (deployments/open5gs/config/upf-*.yaml, ADR-011). Every packet on `ogstun` is eMBB and every\npacket on `ogstun2` is URLLC,\
    \ by construction. Reading the kernel's counters for those devices is\ntherefore an exact per-slice measurement, not an\
    \ estimate.\n\nIt runs inside the UPF container, started by upf-entrypoint.sh, because those devices only\nexist in the\
    \ UPF's network namespace. It reads /sys and never touches the UPF process.\n\nDirection, as seen by the UPF's TUN device:\n\
    \    rx on ogstunN  = packets the UPF WROTE into the device (decapsulated from the UE)  = UPLINK\n    tx on ogstunN  =\
    \ packets the kernel handed the UPF to encapsulate towards the UE    = DOWNLINK\nFor a TUN device, what the userspace\
    \ program writes is what the kernel \"receives\". This is\ncounter-intuitive, and the first version of this exporter had\
    \ it backwards. It was settled\nby measurement, not by reasoning: 20 uplink ICMP packets of 1028 bytes moved rx_bytes\
    \ by\nexactly 20560 (docs/open5gs.md, \"Verification\").\n\"\"\"\n\nimport os\nimport time\nfrom http.server import BaseHTTPRequestHandler,\
    \ HTTPServer\n\nPORT = int(os.environ.get(\"PORT\", \"9120\"))\n\n# device:sst:sd:name \u2014 set in docker-compose.yaml\
    \ from the same slice plan as the configs.\nSLICES = [tuple(s.split(\":\")) for s in\n          os.environ.get(\"SLICE_DEVICES\"\
    ,\n                         \"ogstun:1:010203:eMBB ogstun2:2:112233:URLLC\").split()]\n\n\ndef read(dev, stat):\n    try:\n\
    \        with open(\"/sys/class/net/%s/statistics/%s\" % (dev, stat)) as f:\n            return int(f.read())\n    except\
    \ OSError:\n        return None\n\n\ndef render():\n    out = []\n    emit = out.append\n\n    emit(\"# HELP upf_slice_up\
    \ 1 if the slice's UPF TUN device exists and is readable.\")\n    emit(\"# TYPE upf_slice_up gauge\")\n    for dev, sst,\
    \ sd, name in SLICES:\n        emit('upf_slice_up{sst=\"%s\",sd=\"%s\",slice=\"%s\",device=\"%s\"} %d'\n             %\
    \ (sst, sd, name, dev, 0 if read(dev, \"rx_bytes\") is None else 1))\n\n    series = [\n        (\"upf_slice_uplink_bytes_total\"\
    , \"rx_bytes\", \"Bytes UEs on this slice sent out through the UPF.\"),\n        (\"upf_slice_downlink_bytes_total\",\
    \ \"tx_bytes\", \"Bytes delivered back to UEs on this slice through the UPF.\"),\n        (\"upf_slice_uplink_packets_total\"\
    , \"rx_packets\", \"Uplink packets through the UPF on this slice.\"),\n        (\"upf_slice_downlink_packets_total\",\
    \ \"tx_packets\", \"Downlink packets through the UPF on this slice.\"),\n        (\"upf_slice_dropped_packets_total\"\
    , None, \"Packets dropped on this slice's UPF device, both directions.\"),\n    ]\n    for metric, stat, help_text in\
    \ series:\n        emit(\"# HELP %s %s\" % (metric, help_text))\n        emit(\"# TYPE %s counter\" % metric)\n      \
    \  for dev, sst, sd, name in SLICES:\n            if stat is None:\n                a, b = read(dev, \"rx_dropped\"),\
    \ read(dev, \"tx_dropped\")\n                value = None if a is None or b is None else a + b\n            else:\n  \
    \              value = read(dev, stat)\n            if value is not None:\n                emit('%s{sst=\"%s\",sd=\"%s\"\
    ,slice=\"%s\",device=\"%s\"} %d'\n                     % (metric, sst, sd, name, dev, value))\n\n    emit(\"# HELP upf_slice_exporter_scrape_timestamp_seconds\
    \ When this scrape was produced.\")\n    emit(\"# TYPE upf_slice_exporter_scrape_timestamp_seconds gauge\")\n    emit(\"\
    upf_slice_exporter_scrape_timestamp_seconds %.3f\" % time.time())\n    return \"\\n\".join(out) + \"\\n\"\n\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        if self.path.split(\"?\")[0] != \"/metrics\":\n            self.send_response(404)\n \
    \           self.end_headers()\n            return\n        body = render().encode()\n        self.send_response(200)\n\
    \        self.send_header(\"Content-Type\", \"text/plain; version=0.0.4\")\n        self.send_header(\"Content-Length\"\
    , str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def log_message(self, *args):\n \
    \       pass\n\n\nif __name__ == \"__main__\":\n    print(\"upf_slice_exporter on :%d for %s\" % (PORT, \", \".join(\"\
    %s=%s\" % (d, n) for d, _, _, n in SLICES)),\n          flush=True)\n    HTTPServer((\"0.0.0.0\", PORT), Handler).serve_forever()\n"
  upf-entrypoint.sh: "#!/bin/sh\n# upf-entrypoint.sh \u2014 prepare ONE slice's user plane, then run its UPF.\n#\n# There\
    \ is one UPF container per slice (ADR-011). Each gets, from docker-compose.yaml:\n#   UPF_CONFIG     its config file \
    \           e.g. /etc/open5gs/upf-embb.yaml\n#   TUN_DEV        its TUN device             e.g. ogstun\n#   TUN_GATEWAY\
    \    the pool gateway/prefix    e.g. 10.45.0.1/16\n#   TUN_POOL       the UE address pool        e.g. 10.45.0.0/16\n#\
    \   SLICE_DEVICES  what the traffic exporter reports, \"dev:sst:sd:name\"\n#\n# The Open5GS UPF forwards packets in userspace\
    \ through the TUN device, which must exist and\n# hold the pool gateway before the UPF starts; NAT lets UE traffic leave\
    \ the container. None\n# of this needs a kernel module, which is why it works on WSL2.\nset -eu\n\n: \"${UPF_CONFIG:?}\"\
    \ \"${TUN_DEV:?}\" \"${TUN_GATEWAY:?}\" \"${TUN_POOL:?}\"\n\nip tuntap add name \"$TUN_DEV\" mode tun 2>/dev/null || true\n\
    ip addr replace \"$TUN_GATEWAY\" dev \"$TUN_DEV\"\nip link set \"$TUN_DEV\" up\n# The kernel queues packets for the UPF\
    \ on the TUN device; the default 500 overflowed under\n# UDP bursts and dropped 8.5 % of an 80 Mbps downlink (tx_dropped\
    \ on the TUN, every lost\n# packet accounted for). 10000 took the same run to 0.00 % loss (ADR-012).\nip link set \"$TUN_DEV\"\
    \ txqueuelen \"${TUN_TXQUEUELEN:-10000}\"\n# Traffic to the lab data networks (o5gs-dn-*) is routed, not NATed, so a DN\
    \ sees each UE's\n# real address; everything else (e.g. the internet) is masqueraded.\nif [ -n \"${DN_SUBNET:-}\" ]; then\n\
    \  iptables -t nat -C POSTROUTING -s \"$TUN_POOL\" -d \"$DN_SUBNET\" -j RETURN 2>/dev/null \\\n    || iptables -t nat\
    \ -I POSTROUTING 1 -s \"$TUN_POOL\" -d \"$DN_SUBNET\" -j RETURN\nfi\niptables -t nat -C POSTROUTING -s \"$TUN_POOL\" !\
    \ -o \"$TUN_DEV\" -j MASQUERADE 2>/dev/null \\\n  || iptables -t nat -A POSTROUTING -s \"$TUN_POOL\" ! -o \"$TUN_DEV\"\
    \ -j MASQUERADE\niptables -P FORWARD ACCEPT\necho \"upf-entrypoint: $TUN_DEV up, gateway $TUN_GATEWAY, NAT for $TUN_POOL,\
    \ config $UPF_CONFIG\"\n\n# Per-slice traffic exporter on :9120. It runs HERE, not as a sidecar: the TUN device exists\n\
    # only in this container's network namespace, and a sidecar that shares a namespace is\n# stranded in a dead one when\
    \ this container restarts \u2014 Docker then gave up restarting it.\n( while true; do python3 -u /opt/o5gs-obs/upf_slice_exporter.py;\
    \ sleep 2; done ) &\n\nexec open5gs-upfd -c \"$UPF_CONFIG\"\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o5gs-prometheus
  namespace: o5gs
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\n  external_labels:\n    deployment: open5gs\n\
    scrape_configs:\n- job_name: open5gs\n  static_configs:\n  - targets:\n    - amf.o5gs.svc.cluster.local:9090\n    labels:\n\
    \      nf: amf\n  - targets:\n    - smf.o5gs.svc.cluster.local:9090\n    labels:\n      nf: smf\n  - targets:\n    - upf-embb.o5gs.svc.cluster.local:9090\n\
    \    labels:\n      nf: upf\n      slice: eMBB\n  - targets:\n    - upf-urllc.o5gs.svc.cluster.local:9090\n    labels:\n\
    \      nf: upf\n      slice: URLLC\n  - targets:\n    - pcf.o5gs.svc.cluster.local:9090\n    labels:\n      nf: pcf\n\
    - job_name: upf-slice-traffic\n  static_configs:\n  - targets:\n    - upf-embb.o5gs.svc.cluster.local:9120\n    - upf-urllc.o5gs.svc.cluster.local:9120\n\
    \    labels:\n      component: upf-slice-exporter\n- job_name: ue-probe\n  static_configs:\n  - targets:\n    - ue.o5gs.svc.cluster.local:9121\n\
    \    labels:\n      component: ue-probe-exporter\n- job_name: prometheus\n  static_configs:\n  - targets:\n    - localhost:9090\n"
