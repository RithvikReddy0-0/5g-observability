apiVersion: v1
kind: ConfigMap
metadata:
  name: o5gs-obs
  namespace: o5gs
data:
  kpi_collector.py: "#!/usr/bin/env python3\n\"\"\"\nkpi_collector.py \u2014 receives a slice's measurement traffic in its\
    \ data network and turns it into\nKPIs: one-way latency, packet loss, active devices.\n\nPhase 2b, Track 2 (docs/adr/ADR-015-traffic-profiles-and-kpi-scorecard.md).\
    \ It runs in the\nslice's data-network container (o5gs-dn-urllc, o5gs-dn-mmtc). traffic_agent.py in the UE\ncontainer\
    \ sends the packets, from each UE's own PDU-session address, so every packet crosses the\nslice's real path: UE -> gNB\
    \ (GTP-U) -> UPF -> data network.\n\nWHY ONE-WAY LATENCY IS EXACT HERE\nSender and receiver run in containers on one kernel,\
    \ and Docker does not give containers their\nown time namespace, so CLOCK_MONOTONIC is the same clock on both sides (checked:\
    \ readings taken\nUE, DN, UE came out in order). Latency is receive time minus the send time carried in the packet\n\u2014\
    \ the \"time from the source UE to the destination\" the Phase 2b KPI notes define \u2014 with no clock\nsynchronisation\
    \ error, and immune to the wall-clock steps this VM suffers (ADR-014).\n\nPACKET FORMATS (big-endian)\n  URLLC: device\
    \ u16 \xB7 epoch u8 \xB7 seq u32 \xB7 send-time u64 (ns)            padded to its size\n  mMTC : device u16 \xB7 epoch\
    \ u8 \xB7 seq u24 \xB7 send-time u32 (ms, mod 2^32)  exactly 10 bytes\nThe device id is the last four digits of the UE's\
    \ IMSI. The epoch changes whenever the sender\nrestarts, so a restarted sequence is not counted as loss.\n\nLOSS. For\
    \ each (device, epoch) the expected count is last seq - first seq + 1; loss is\n1 - received / expected. A packet lost\
    \ after the last one received is not yet visible; over a\nrun of thousands of packets that is noise, and it never inflates\
    \ loss.\n\nExposes, on METRICS_PORT:\n  /metrics      Prometheus: kpi_packets_{received,expected}_total, kpi_owd_ms{stat}\
    \ over the\n                last WINDOW seconds, kpi_devices_active, kpi_devices_seen\n  /run/start    starts a measurement\
    \ run (clears the run accumulators)\n  /run/stats    JSON for the run so far: counts, loss, latency percentiles, jitter,\
    \ per device\n\nEnvironment: SLICE (URLLC|mMTC), MODE (urllc|mmtc), UDP_PORT, METRICS_PORT (9130),\nWINDOW (60 s), ACTIVE_WINDOW\
    \ (seconds a device counts as active after its last packet).\n\"\"\"\n\nimport collections\nimport json\nimport os\nimport\
    \ socket\nimport struct\nimport threading\nimport time\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\
    \nSLICE = os.environ.get(\"SLICE\", \"URLLC\")\nMODE = os.environ.get(\"MODE\", \"urllc\")\nUDP_PORT = int(os.environ.get(\"\
    UDP_PORT\", \"5400\"))\nMETRICS_PORT = int(os.environ.get(\"METRICS_PORT\", \"9130\"))\nWINDOW = float(os.environ.get(\"\
    WINDOW\", \"60\"))\nACTIVE_WINDOW = float(os.environ.get(\"ACTIVE_WINDOW\", \"10\" if MODE == \"urllc\" else \"90\"))\n\
    \nURLLC = struct.Struct(\"!HBIQ\")      # 15 bytes\nMMTC_HEAD = struct.Struct(\"!HB\")    # + 3-byte seq + 4-byte ms =\
    \ 10 bytes\n\nlock = threading.Lock()\n\n\nclass Tally:\n    \"\"\"Counters and latency samples for one span of time (the\
    \ life of the process, or a run).\"\"\"\n\n    def __init__(self):\n        self.started = time.monotonic()\n        self.streams\
    \ = {}            # (device, epoch) -> [first, last, received]\n        self.owd = []                # one-way delay samples,\
    \ ms\n        self.jitter = []             # |owd - previous owd of the same device|, ms\n        self.last_owd = {}\n\
    \        self.per_device = collections.defaultdict(lambda: {\"received\": 0, \"owd_sum\": 0.0})\n        self.malformed\
    \ = 0\n\n    def add(self, dev, epoch, seq, owd_ms):\n        s = self.streams.get((dev, epoch))\n        if s is None:\n\
    \            self.streams[(dev, epoch)] = [seq, seq, 1]\n        else:\n            s[0] = min(s[0], seq)\n          \
    \  s[1] = max(s[1], seq)\n            s[2] += 1\n        self.owd.append(owd_ms)\n        if dev in self.last_owd:\n \
    \           self.jitter.append(abs(owd_ms - self.last_owd[dev]))\n        self.last_owd[dev] = owd_ms\n        d = self.per_device[dev]\n\
    \        d[\"received\"] += 1\n        d[\"owd_sum\"] += owd_ms\n\n    def counts(self):\n        received = sum(s[2]\
    \ for s in self.streams.values())\n        expected = sum(s[1] - s[0] + 1 for s in self.streams.values())\n        return\
    \ received, max(expected, received)\n\n    def stats(self):\n        received, expected = self.counts()\n        per_dev\
    \ = {}\n        for (dev, _), (first, last, rcv) in self.streams.items():\n            p = per_dev.setdefault(dev, {\"\
    received\": 0, \"expected\": 0})\n            p[\"received\"] += rcv\n            p[\"expected\"] += last - first + 1\n\
    \        for dev, p in per_dev.items():\n            d = self.per_device[dev]\n            p[\"owd_mean_ms\"] = round(d[\"\
    owd_sum\"] / d[\"received\"], 3) if d[\"received\"] else None\n        return {\n            \"slice\": SLICE, \"mode\"\
    : MODE,\n            \"duration_s\": round(time.monotonic() - self.started, 1),\n            \"received\": received, \"\
    expected\": expected,\n            \"loss_ratio\": round(1 - received / expected, 6) if expected else None,\n        \
    \    \"devices\": len(per_dev),\n            \"owd_ms\": summary(self.owd),\n            \"jitter_ms_mean\": round(sum(self.jitter)\
    \ / len(self.jitter), 3) if self.jitter else None,\n            \"malformed\": self.malformed,\n            \"per_device\"\
    : {str(k): v for k, v in sorted(per_dev.items())},\n        }\n\n\ndef percentile(sorted_vals, q):\n    if not sorted_vals:\n\
    \        return None\n    i = min(len(sorted_vals) - 1, max(0, int(round(q * (len(sorted_vals) - 1)))))\n    return round(sorted_vals[i],\
    \ 3)\n\n\ndef summary(vals):\n    if not vals:\n        return {\"n\": 0}\n    v = sorted(vals)\n    return {\"n\": len(v),\
    \ \"mean\": round(sum(v) / len(v), 3), \"min\": round(v[0], 3),\n            \"p50\": percentile(v, 0.50), \"p95\": percentile(v,\
    \ 0.95), \"p99\": percentile(v, 0.99),\n            \"max\": round(v[-1], 3)}\n\n\nlife = Tally()\nrun = Tally()\nrecent\
    \ = collections.deque()         # (monotonic s, owd ms) for the rolling window\nlast_seen = {}                       #\
    \ device -> monotonic s\n\n\ndef parse(data, now_ns):\n    \"\"\"-> (device, epoch, seq, one-way delay ms) or None.\"\"\
    \"\n    if MODE == \"urllc\":\n        if len(data) < URLLC.size:\n            return None\n        dev, epoch, seq, t_ns\
    \ = URLLC.unpack_from(data)\n        return dev, epoch, seq, (now_ns - t_ns) / 1e6\n    if len(data) != 10:\n        return\
    \ None\n    dev, epoch = MMTC_HEAD.unpack_from(data)\n    seq = int.from_bytes(data[3:6], \"big\")\n    t_ms = int.from_bytes(data[6:10],\
    \ \"big\")\n    owd = ((now_ns // 1_000_000) - t_ms) % (1 << 32)\n    return dev, epoch, seq, float(owd)\n\n\ndef receive_loop():\n\
    \    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n    sock.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF,\
    \ 4 << 20)\n    sock.bind((\"0.0.0.0\", UDP_PORT))\n    while True:\n        data, _ = sock.recvfrom(2048)\n        now_ns\
    \ = time.monotonic_ns()\n        p = parse(data, now_ns)\n        with lock:\n            if p is None:\n            \
    \    life.malformed += 1\n                run.malformed += 1\n                continue\n            dev, epoch, seq, owd\
    \ = p\n            life.add(dev, epoch, seq, owd)\n            run.add(dev, epoch, seq, owd)\n            now = now_ns\
    \ / 1e9\n            recent.append((now, owd))\n            last_seen[dev] = now\n            # The lifetime tally keeps\
    \ counts, not every sample.\n            if len(life.owd) > 10000:\n                del life.owd[:5000]\n            \
    \    del life.jitter[:5000]\n\n\ndef render_metrics():\n    now = time.monotonic()\n    with lock:\n        while recent\
    \ and recent[0][0] < now - WINDOW:\n            recent.popleft()\n        window = summary([o for _, o in recent])\n \
    \       received, expected = life.counts()\n        active = sum(1 for t in last_seen.values() if t >= now - ACTIVE_WINDOW)\n\
    \        seen = len(last_seen)\n    lab = 'slice=\"%s\"' % SLICE\n    out = [\n        \"# HELP kpi_packets_received_total\
    \ Measurement packets received from the slice's UEs.\",\n        \"# TYPE kpi_packets_received_total counter\",\n    \
    \    \"kpi_packets_received_total{%s} %d\" % (lab, received),\n        \"# HELP kpi_packets_expected_total Packets the\
    \ senders' sequence numbers say were sent.\",\n        \"# TYPE kpi_packets_expected_total counter\",\n        \"kpi_packets_expected_total{%s}\
    \ %d\" % (lab, expected),\n        \"# HELP kpi_owd_ms One-way delay UE -> data network over the last WINDOW seconds.\"\
    ,\n        \"# TYPE kpi_owd_ms gauge\",\n    ]\n    for stat in (\"mean\", \"p50\", \"p95\", \"p99\", \"max\"):\n    \
    \    if stat in window and window[stat] is not None:\n            out.append('kpi_owd_ms{%s,stat=\"%s\"} %s' % (lab, stat,\
    \ window[stat]))\n    out += [\n        \"# HELP kpi_owd_samples One-way delay samples in the window.\",\n        \"#\
    \ TYPE kpi_owd_samples gauge\",\n        \"kpi_owd_samples{%s} %d\" % (lab, window.get(\"n\", 0)),\n        \"# HELP kpi_devices_active\
    \ Devices heard from within ACTIVE_WINDOW seconds.\",\n        \"# TYPE kpi_devices_active gauge\",\n        \"kpi_devices_active{%s}\
    \ %d\" % (lab, active),\n        \"# HELP kpi_devices_seen Devices heard from since the collector started.\",\n      \
    \  \"# TYPE kpi_devices_seen gauge\",\n        \"kpi_devices_seen{%s} %d\" % (lab, seen),\n    ]\n    return \"\\n\".join(out)\
    \ + \"\\n\"\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def _send(self, code, body, ctype):\n        b = body.encode()\n\
    \        self.send_response(code)\n        self.send_header(\"Content-Type\", ctype)\n        self.send_header(\"Content-Length\"\
    , str(len(b)))\n        self.end_headers()\n        self.wfile.write(b)\n\n    def do_GET(self):\n        global run\n\
    \        path = self.path.split(\"?\")[0]\n        if path == \"/metrics\":\n            self._send(200, render_metrics(),\
    \ \"text/plain; version=0.0.4\")\n        elif path == \"/run/start\":\n            with lock:\n                run =\
    \ Tally()\n            self._send(200, json.dumps({\"started\": True, \"slice\": SLICE}), \"application/json\")\n    \
    \    elif path == \"/run/stats\":\n            with lock:\n                body = json.dumps(run.stats())\n          \
    \  self._send(200, body, \"application/json\")\n        elif path == \"/healthz\":\n            self._send(200, \"ok\\\
    n\", \"text/plain\")\n        else:\n            self._send(404, \"not found\\n\", \"text/plain\")\n\n    def log_message(self,\
    \ *args):\n        pass\n\n\nif __name__ == \"__main__\":\n    print(\"kpi_collector: slice %s, %s packets on udp/%d,\
    \ metrics on :%d\"\n          % (SLICE, MODE, UDP_PORT, METRICS_PORT), flush=True)\n    threading.Thread(target=receive_loop,\
    \ daemon=True).start()\n    ThreadingHTTPServer((\"0.0.0.0\", METRICS_PORT), Handler).serve_forever()\n"
  traffic_agent.py: "#!/usr/bin/env python3\n\"\"\"\ntraffic_agent.py \u2014 what the URLLC and mMTC devices actually send\
    \ (Phase 2b, Track 2).\n\nRuns in the UE container, started by ran/ue-entrypoint.sh. Every UE of a profiled slice sends\n\
    from its OWN PDU-session address, so each packet crosses that slice's gNB and UPF before it\nreaches the slice's data\
    \ network, where kpi_collector.py measures it\n(docs/adr/ADR-015-traffic-profiles-and-kpi-scorecard.md).\n\nProfiles (TRAFFIC_PROFILES,\
    \ one per slice, space separated):\n    <slice>:<pool prefix>:<destination>:<udp port>:<bytes>:<interval s>\nDefault:\n\
    \    URLLC \u2014 64-byte packets every 20 ms from each of its 10 devices: time-sensitive control\n            traffic,\
    \ small and frequent. One-way latency, its percentiles and jitter are the KPIs.\n    mMTC  \u2014 10 bytes every 10 s\
    \ from each of its 70 devices, then silence until the next report:\n            the guide's \"IoT sends 10 bytes periodically\"\
    . Delivery and report latency are KPIs.\neMBB is not here: its bulk transfers are run on demand by tools/kpi/run_kpis.py,\
    \ because a\npermanent bulk flood would saturate the laptop and distort every other measurement.\n\nThe interval and size\
    \ are PROVISIONAL defaults (the KPI notes do not fix them); a sweep overrides\nthem at run time by writing /tmp/traffic-profile.json,\
    \ e.g.\n    {\"mMTC\": {\"interval\": 1}, \"URLLC\": {\"enabled\": false}}\nwhich this agent re-reads every 2 s.\n\nEach\
    \ device starts at a random phase, so 70 IoT devices do not all report in the same instant.\nPacket formats are documented\
    \ in kpi_collector.py. Exposes sent counts on :9122 (/metrics).\n\"\"\"\n\nimport heapq\nimport json\nimport os\nimport\
    \ random\nimport re\nimport socket\nimport struct\nimport subprocess\nimport threading\nimport time\nfrom http.server\
    \ import BaseHTTPRequestHandler, HTTPServer\n\nDEFAULT = (\"URLLC:10.46.:10.53.0.52:5400:64:0.02 \"\n           \"mMTC:10.47.:10.53.0.53:5401:10:10\"\
    )\nOVERRIDE = \"/tmp/traffic-profile.json\"\nPORT = int(os.environ.get(\"AGENT_PORT\", \"9122\"))\nURLLC = struct.Struct(\"\
    !HBIQ\")\nEPOCH = random.randrange(256)          # changes on every restart: a new sequence is not loss\n\nADDR_RE = re.compile(r\"\
    ^\\d+:\\s+(uesimtun(\\d{4})\\d)\\s+inet\\s+([\\d.]+)/\", re.M)\n\nstate_lock = threading.Lock()\nsent = {}           \
    \ # slice -> packets sent\nerrors = {}          # slice -> send errors\ndevices = {}         # slice -> devices currently\
    \ sending\n\n\ndef parse_profiles(text):\n    out = {}\n    for item in text.split():\n        name, prefix, dst, port,\
    \ size, interval = item.split(\":\")\n        out[name] = {\"prefix\": prefix, \"dst\": dst, \"port\": int(port), \"bytes\"\
    : int(size),\n                     \"interval\": float(interval), \"enabled\": True}\n    return out\n\n\nBASE = parse_profiles(os.environ.get(\"\
    TRAFFIC_PROFILES\", DEFAULT))\n\n\ndef effective():\n    \"\"\"The base profiles with the run-time override applied.\"\
    \"\"\n    prof = {k: dict(v) for k, v in BASE.items()}\n    try:\n        with open(OVERRIDE) as f:\n            ov =\
    \ json.load(f)\n        for name, changes in ov.items():\n            if name in prof and isinstance(changes, dict):\n\
    \                prof[name].update({k: v for k, v in changes.items() if k in (\"interval\", \"bytes\", \"enabled\")})\n\
    \    except (OSError, ValueError):\n        pass\n    return prof\n\n\ndef ue_addresses():\n    \"\"\"[(device id, address)]\
    \ for every UE interface that holds an address.\"\"\"\n    out = subprocess.run([\"ip\", \"-4\", \"-o\", \"addr\", \"\
    show\"], capture_output=True, text=True).stdout\n    return [(int(tag), ip) for _, tag, ip in ADDR_RE.findall(out)]\n\n\
    \ndef resolve(host):\n    try:\n        return socket.gethostbyname(host)\n    except OSError:\n        return None\n\n\
    \nclass Device:\n    def __init__(self, slice_name, dev, ip):\n        self.slice, self.dev, self.ip = slice_name, dev,\
    \ ip\n        self.seq = 0\n        self.sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n        self.sock.bind((ip,\
    \ 0))            # the UE's own address -> its PDU session -> its UPF\n\n    def payload(self, size):\n        now = time.monotonic_ns()\n\
    \        if self.slice == \"mMTC\" or size == 10:\n            body = (self.dev.to_bytes(2, \"big\") + bytes([EPOCH])\
    \ + (self.seq % (1 << 24)).to_bytes(3, \"big\")\n                    + ((now // 1_000_000) % (1 << 32)).to_bytes(4, \"\
    big\"))\n            return body[:max(size, 10)]\n        head = URLLC.pack(self.dev, EPOCH, self.seq % (1 << 32), now)\n\
    \        return head + b\"\\0\" * max(0, size - len(head))\n\n    def close(self):\n        try:\n            self.sock.close()\n\
    \        except OSError:\n            pass\n\n\ndef run():\n    devs = {}                  # (slice, dev) -> Device\n\
    \    heap = []                  # (due monotonic s, slice, dev)\n    dst_cache = {}\n    next_scan = 0.0\n    prof = effective()\n\
    \    while True:\n        now = time.monotonic()\n        if now >= next_scan:\n            prof = effective()\n     \
    \       addrs = ue_addresses()\n            wanted = {}\n            for name, p in prof.items():\n                if\
    \ not p[\"enabled\"]:\n                    continue\n                for dev, ip in addrs:\n                    if ip.startswith(p[\"\
    prefix\"]):\n                        wanted[(name, dev)] = ip\n            for key in list(devs):                    \
    \     # gone, disabled, or re-addressed\n                if wanted.get(key) != devs[key].ip:\n                    devs.pop(key).close()\n\
    \            for key, ip in wanted.items():\n                if key not in devs:\n                    try:\n         \
    \               devs[key] = Device(key[0], key[1], ip)\n                    except OSError:\n                        continue\n\
    \                    interval = prof[key[0]][\"interval\"]\n                    heapq.heappush(heap, (now + random.uniform(0,\
    \ interval), key[0], key[1]))\n            with state_lock:\n                for name in prof:\n                    devices[name]\
    \ = sum(1 for k in devs if k[0] == name)\n            next_scan = now + 2.0\n        if not heap:\n            time.sleep(0.5)\n\
    \            continue\n        due, name, dev = heap[0]\n        if due > now:\n            time.sleep(min(due - now,\
    \ max(0.0, next_scan - now), 0.5))\n            continue\n        heapq.heappop(heap)\n        d = devs.get((name, dev))\n\
    \        if d is None:                                      # removed since it was scheduled\n            continue\n \
    \       p = prof[name]\n        if p[\"dst\"] not in dst_cache:\n            dst_cache[p[\"dst\"]] = resolve(p[\"dst\"\
    ])\n        dst = dst_cache[p[\"dst\"]]\n        try:\n            if dst is None:\n                raise OSError(\"cannot\
    \ resolve %s\" % p[\"dst\"])\n            d.sock.sendto(d.payload(p[\"bytes\"]), (dst, p[\"port\"]))\n            d.seq\
    \ += 1\n            with state_lock:\n                sent[name] = sent.get(name, 0) + 1\n        except OSError:\n  \
    \          with state_lock:\n                errors[name] = errors.get(name, 0) + 1\n            dst_cache.pop(p[\"dst\"\
    ], None)\n        # Next send: on schedule, never in a burst to catch up after a stall.\n        heapq.heappush(heap,\
    \ (max(due + p[\"interval\"], time.monotonic()), name, dev))\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n\
    \        if self.path.split(\"?\")[0] != \"/metrics\":\n            self.send_response(404)\n            self.end_headers()\n\
    \            return\n        prof = effective()\n        with state_lock:\n            lines = [\"# HELP kpi_agent_sent_total\
    \ Measurement packets sent by the traffic agent.\",\n                     \"# TYPE kpi_agent_sent_total counter\"]\n \
    \           lines += ['kpi_agent_sent_total{slice=\"%s\"} %d' % (n, sent.get(n, 0)) for n in prof]\n            lines\
    \ += [\"# TYPE kpi_agent_send_errors_total counter\"]\n            lines += ['kpi_agent_send_errors_total{slice=\"%s\"\
    } %d' % (n, errors.get(n, 0)) for n in prof]\n            lines += [\"# HELP kpi_agent_devices Devices currently sending.\"\
    , \"# TYPE kpi_agent_devices gauge\"]\n            lines += ['kpi_agent_devices{slice=\"%s\"} %d' % (n, devices.get(n,\
    \ 0)) for n in prof]\n            lines += [\"# HELP kpi_agent_interval_seconds Current reporting interval per device.\"\
    ,\n                      \"# TYPE kpi_agent_interval_seconds gauge\"]\n            lines += ['kpi_agent_interval_seconds{slice=\"\
    %s\"} %s' % (n, p[\"interval\"] if p[\"enabled\"] else 0)\n                      for n, p in prof.items()]\n        body\
    \ = (\"\\n\".join(lines) + \"\\n\").encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\"\
    , \"text/plain; version=0.0.4\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n\
    \        self.wfile.write(body)\n\n    def log_message(self, *args):\n        pass\n\n\nif __name__ == \"__main__\":\n\
    \    print(\"traffic_agent: %s (override file %s), metrics on :%d\"\n          % (\", \".join(\"%s %dB every %gs -> %s:%d\"\
    \ % (n, p[\"bytes\"], p[\"interval\"], p[\"dst\"], p[\"port\"])\n                       for n, p in BASE.items()), OVERRIDE,\
    \ PORT), flush=True)\n    threading.Thread(target=run, daemon=True).start()\n    HTTPServer((\"0.0.0.0\", PORT), Handler).serve_forever()\n"
  ue_probe_exporter.py: "#!/usr/bin/env python3\n\"\"\"\nue_probe_exporter.py \u2014 per-slice reachability and latency, measured\
    \ from the UEs themselves.\n\nWHY THIS EXISTS\nStopping every UE abruptly left the core's metrics unchanged: the AMF still\
    \ reported 20 UEs\non the RAN and the UPF still held 20 sessions, because nothing told the core the UEs had\ngone. A KPI\
    \ gate built only on core-side metrics passed with zero working UEs (measured, not\nassumed \u2014 see docs/open5gs.md).\
    \ Liveness has to be observed from the UE side.\n\nEvery INTERVAL seconds this pings the slice's UPF gateway from each\
    \ UE's own PDU-session\ninterface, so every probe crosses the real path: UE TUN -> gNB (GTP-U) -> UPF -> slice TUN.\n\n\
    It runs inside the UE container, started by ue-entrypoint.sh, because the uesimtunN\ninterfaces only exist in that network\
    \ namespace. It never touches the UE processes.\n\nExported per slice:\n    ue_probe_interfaces{slice}        UE interfaces\
    \ holding an address from the slice's pool\n    ue_probe_reachable{slice}         of those, how many answered the last\
    \ round\n    ue_probe_rtt_ms{slice,stat}       min / avg / max round-trip time of the last round\n    ue_probe_rounds_total,\
    \ ue_probe_round_duration_seconds\n\"\"\"\n\nimport os\nimport re\nimport subprocess\nimport threading\nimport time\n\
    from http.server import BaseHTTPRequestHandler, HTTPServer\n\nPORT = int(os.environ.get(\"PORT\", \"9121\"))\nINTERVAL\
    \ = float(os.environ.get(\"INTERVAL\", \"5\"))\nTIMEOUT_S = int(os.environ.get(\"PROBE_TIMEOUT\", \"1\"))\n\n# prefix:gateway:name\
    \ \u2014 the pools from deployments/open5gs/config/smf.yaml\nSLICES = [tuple(s.split(\":\")) for s in\n          os.environ.get(\"\
    SLICE_POOLS\", \"10.45.:10.45.0.1:eMBB 10.46.:10.46.0.1:URLLC\").split()]\n\nADDR_RE = re.compile(r\"^\\d+:\\s+(uesimtun\\\
    d+)\\s+inet\\s+([\\d.]+)/\", re.M)\n# busybox prints \"min/avg/max = a/b/c ms\"; iputils prints \"min/avg/max/mdev = a/b/c/d\
    \ ms\".\n# The first version only matched busybox, and reported 0 reachable UEs while its probes were\n# visibly arriving\
    \ at the UPF.\nRTT_RE = re.compile(r\"= [\\d.]+/([\\d.]+)/[\\d.]+(?:/[\\d.]+)? ms\")\n\nstate = {\"slices\": {}, \"rounds\"\
    : 0, \"duration\": 0.0}\nlock = threading.Lock()\n\n\ndef interfaces():\n    out = subprocess.run([\"ip\", \"-4\", \"\
    -o\", \"addr\", \"show\"], capture_output=True, text=True).stdout\n    return ADDR_RE.findall(out)\n\n\ndef probe_round():\n\
    \    started = time.time()\n    ifaces = interfaces()\n    procs = []\n    for prefix, gw, name in SLICES:\n        for\
    \ dev, ip in ifaces:\n            if ip.startswith(prefix):\n                p = subprocess.Popen([\"ping\", \"-I\", dev,\
    \ \"-c\", \"1\", \"-W\", str(TIMEOUT_S), gw],\n                                     stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\
    \ text=True)\n                procs.append((name, p))\n\n    result = {name: {\"interfaces\": 0, \"reachable\": 0, \"\
    rtts\": []} for _, _, name in SLICES}\n    for name, p in procs:\n        try:\n            out, _ = p.communicate(timeout=TIMEOUT_S\
    \ + 2)\n        except subprocess.TimeoutExpired:\n            p.kill()\n            out = \"\"\n        r = result[name]\n\
    \        r[\"interfaces\"] += 1\n        m = RTT_RE.search(out or \"\")\n        if p.returncode == 0 and m:\n       \
    \     r[\"reachable\"] += 1\n            r[\"rtts\"].append(float(m.group(1)))\n\n    with lock:\n        state[\"slices\"\
    ] = result\n        state[\"rounds\"] += 1\n        state[\"duration\"] = time.time() - started\n\n\ndef loop():\n   \
    \ while True:\n        t0 = time.time()\n        try:\n            probe_round()\n        except Exception as e:     \
    \                   # never let one bad round kill the exporter\n            print(\"probe round failed: %s\" % e, flush=True)\n\
    \        time.sleep(max(0.0, INTERVAL - (time.time() - t0)))\n\n\ndef render():\n    with lock:\n        s = dict(state)\n\
    \    lines = [\n        \"# HELP ue_probe_interfaces UE PDU-session interfaces holding an address from the slice's pool.\"\
    ,\n        \"# TYPE ue_probe_interfaces gauge\",\n        \"# HELP ue_probe_reachable UE interfaces whose probe through\
    \ the UPF succeeded in the last round.\",\n        \"# TYPE ue_probe_reachable gauge\",\n        \"# HELP ue_probe_rtt_ms\
    \ Round-trip time UE -> gNB -> UPF gateway in the last round.\",\n        \"# TYPE ue_probe_rtt_ms gauge\",\n    ]\n \
    \   for _, _, name in SLICES:\n        r = s[\"slices\"].get(name, {\"interfaces\": 0, \"reachable\": 0, \"rtts\": []})\n\
    \        lines.append('ue_probe_interfaces{slice=\"%s\"} %d' % (name, r[\"interfaces\"]))\n        lines.append('ue_probe_reachable{slice=\"\
    %s\"} %d' % (name, r[\"reachable\"]))\n        if r[\"rtts\"]:\n            rt = r[\"rtts\"]\n            for stat, v\
    \ in ((\"min\", min(rt)), (\"avg\", sum(rt) / len(rt)), (\"max\", max(rt))):\n                lines.append('ue_probe_rtt_ms{slice=\"\
    %s\",stat=\"%s\"} %.3f' % (name, stat, v))\n    lines += [\n        \"# HELP ue_probe_rounds_total Probe rounds completed.\"\
    ,\n        \"# TYPE ue_probe_rounds_total counter\",\n        \"ue_probe_rounds_total %d\" % s[\"rounds\"],\n        \"\
    # HELP ue_probe_round_duration_seconds Wall time of the last probe round.\",\n        \"# TYPE ue_probe_round_duration_seconds\
    \ gauge\",\n        \"ue_probe_round_duration_seconds %.3f\" % s[\"duration\"],\n    ]\n    return \"\\n\".join(lines)\
    \ + \"\\n\"\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path.split(\"?\")[0] !=\
    \ \"/metrics\":\n            self.send_response(404)\n            self.end_headers()\n            return\n        body\
    \ = render().encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"text/plain; version=0.0.4\"\
    )\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\
    \n    def log_message(self, *args):\n        pass\n\n\nif __name__ == \"__main__\":\n    print(\"ue_probe_exporter on\
    \ :%d, every %.0fs, slices: %s\"\n          % (PORT, INTERVAL, \", \".join(\"%s via %s\" % (n, g) for _, g, n in SLICES)),\
    \ flush=True)\n    threading.Thread(target=loop, daemon=True).start()\n    HTTPServer((\"0.0.0.0\", PORT), Handler).serve_forever()\n"
  upf_slice_exporter.py: "#!/usr/bin/env python3\n\"\"\"\nupf_slice_exporter.py \u2014 measured, per-slice user-plane traffic\
    \ from the Open5GS UPF.\n\nWHY THIS EXISTS\nOpen5GS's UPF exports traffic volume (fivegs_ep_n3_gtp_{in,out}datavolumeqosleveln3upf),\
    \ but\nthe only label is `qfi`. The default QoS flow of every PDU session is QFI 1 regardless of\nslice, so those counters\
    \ mix eMBB and URLLC traffic together. They cannot answer \"how much\nis each slice carrying\" \u2014 the same R-02 gap\
    \ free5GC had, narrower but still real.\n\nThis deployment gives each slice its own DNN, address pool, UPF and TUN device\n\
    (deployments/open5gs/config/upf-*.yaml, ADR-011). Every packet on `ogstun` is eMBB and every\npacket on `ogstun2` is URLLC,\
    \ by construction. Reading the kernel's counters for those devices is\ntherefore an exact per-slice measurement, not an\
    \ estimate.\n\nIt runs inside the UPF container, started by upf-entrypoint.sh, because those devices only\nexist in the\
    \ UPF's network namespace. It reads /sys and never touches the UPF process.\n\nDirection, as seen by the UPF's TUN device:\n\
    \    rx on ogstunN  = packets the UPF WROTE into the device (decapsulated from the UE)  = UPLINK\n    tx on ogstunN  =\
    \ packets the kernel handed the UPF to encapsulate towards the UE    = DOWNLINK\nFor a TUN device, what the userspace\
    \ program writes is what the kernel \"receives\". This is\ncounter-intuitive, and the first version of this exporter had\
    \ it backwards. It was settled\nby measurement, not by reasoning: 20 uplink ICMP packets of 1028 bytes moved rx_bytes\
    \ by\nexactly 20560 (docs/open5gs.md, \"Verification\").\n\"\"\"\n\nimport os\nimport time\nfrom http.server import BaseHTTPRequestHandler,\
    \ HTTPServer\n\nPORT = int(os.environ.get(\"PORT\", \"9120\"))\n\n# device:sst:sd:name \u2014 set in docker-compose.yaml\
    \ from the same slice plan as the configs.\nSLICES = [tuple(s.split(\":\")) for s in\n          os.environ.get(\"SLICE_DEVICES\"\
    ,\n                         \"ogstun:1:010203:eMBB ogstun2:2:112233:URLLC\").split()]\n\n\ndef read(dev, stat):\n    try:\n\
    \        with open(\"/sys/class/net/%s/statistics/%s\" % (dev, stat)) as f:\n            return int(f.read())\n    except\
    \ OSError:\n        return None\n\n\ndef render():\n    out = []\n    emit = out.append\n\n    emit(\"# HELP upf_slice_up\
    \ 1 if the slice's UPF TUN device exists and is readable.\")\n    emit(\"# TYPE upf_slice_up gauge\")\n    for dev, sst,\
    \ sd, name in SLICES:\n        emit('upf_slice_up{sst=\"%s\",sd=\"%s\",slice=\"%s\",device=\"%s\"} %d'\n             %\
    \ (sst, sd, name, dev, 0 if read(dev, \"rx_bytes\") is None else 1))\n\n    series = [\n        (\"upf_slice_uplink_bytes_total\"\
    , \"rx_bytes\", \"Bytes UEs on this slice sent out through the UPF.\"),\n        (\"upf_slice_downlink_bytes_total\",\
    \ \"tx_bytes\", \"Bytes delivered back to UEs on this slice through the UPF.\"),\n        (\"upf_slice_uplink_packets_total\"\
    , \"rx_packets\", \"Uplink packets through the UPF on this slice.\"),\n        (\"upf_slice_downlink_packets_total\",\
    \ \"tx_packets\", \"Downlink packets through the UPF on this slice.\"),\n        (\"upf_slice_dropped_packets_total\"\
    , None, \"Packets dropped on this slice's UPF device, both directions.\"),\n    ]\n    for metric, stat, help_text in\
    \ series:\n        emit(\"# HELP %s %s\" % (metric, help_text))\n        emit(\"# TYPE %s counter\" % metric)\n      \
    \  for dev, sst, sd, name in SLICES:\n            if stat is None:\n                a, b = read(dev, \"rx_dropped\"),\
    \ read(dev, \"tx_dropped\")\n                value = None if a is None or b is None else a + b\n            else:\n  \
    \              value = read(dev, stat)\n            if value is not None:\n                emit('%s{sst=\"%s\",sd=\"%s\"\
    ,slice=\"%s\",device=\"%s\"} %d'\n                     % (metric, sst, sd, name, dev, value))\n\n    emit(\"# HELP upf_slice_exporter_scrape_timestamp_seconds\
    \ When this scrape was produced.\")\n    emit(\"# TYPE upf_slice_exporter_scrape_timestamp_seconds gauge\")\n    emit(\"\
    upf_slice_exporter_scrape_timestamp_seconds %.3f\" % time.time())\n    return \"\\n\".join(out) + \"\\n\"\n\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        if self.path.split(\"?\")[0] != \"/metrics\":\n            self.send_response(404)\n \
    \           self.end_headers()\n            return\n        body = render().encode()\n        self.send_response(200)\n\
    \        self.send_header(\"Content-Type\", \"text/plain; version=0.0.4\")\n        self.send_header(\"Content-Length\"\
    , str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def log_message(self, *args):\n \
    \       pass\n\n\nif __name__ == \"__main__\":\n    print(\"upf_slice_exporter on :%d for %s\" % (PORT, \", \".join(\"\
    %s=%s\" % (d, n) for d, _, _, n in SLICES)),\n          flush=True)\n    HTTPServer((\"0.0.0.0\", PORT), Handler).serve_forever()\n"
  upf-entrypoint.sh: "#!/bin/sh\n# upf-entrypoint.sh \u2014 prepare ONE slice's user plane, then run its UPF.\n#\n# There\
    \ is one UPF container per slice (ADR-011). Each gets, from docker-compose.yaml:\n#   UPF_CONFIG     its config file \
    \           e.g. /etc/open5gs/upf-embb.yaml\n#   TUN_DEV        its TUN device             e.g. ogstun\n#   TUN_GATEWAY\
    \    the pool gateway/prefix    e.g. 10.45.0.1/16\n#   TUN_POOL       the UE address pool        e.g. 10.45.0.0/16\n#\
    \   SLICE_DEVICES  what the traffic exporter reports, \"dev:sst:sd:name\"\n#\n# The Open5GS UPF forwards packets in userspace\
    \ through the TUN device, which must exist and\n# hold the pool gateway before the UPF starts; NAT lets UE traffic leave\
    \ the container. None\n# of this needs a kernel module, which is why it works on WSL2.\nset -eu\n\n: \"${UPF_CONFIG:?}\"\
    \ \"${TUN_DEV:?}\" \"${TUN_GATEWAY:?}\" \"${TUN_POOL:?}\"\n\nip tuntap add name \"$TUN_DEV\" mode tun 2>/dev/null || true\n\
    ip addr replace \"$TUN_GATEWAY\" dev \"$TUN_DEV\"\nip link set \"$TUN_DEV\" up\n# The kernel queues packets for the UPF\
    \ on the TUN device; the default 500 overflowed under\n# UDP bursts and dropped 8.5 % of an 80 Mbps downlink (tx_dropped\
    \ on the TUN, every lost\n# packet accounted for). 10000 took the same run to 0.00 % loss (ADR-012).\nip link set \"$TUN_DEV\"\
    \ txqueuelen \"${TUN_TXQUEUELEN:-10000}\"\n# Traffic to the lab data networks (o5gs-dn-*) is routed, not NATed, so a DN\
    \ sees each UE's\n# real address; everything else (e.g. the internet) is masqueraded.\nif [ -n \"${DN_SUBNET:-}\" ]; then\n\
    \  iptables -t nat -C POSTROUTING -s \"$TUN_POOL\" -d \"$DN_SUBNET\" -j RETURN 2>/dev/null \\\n    || iptables -t nat\
    \ -I POSTROUTING 1 -s \"$TUN_POOL\" -d \"$DN_SUBNET\" -j RETURN\nfi\niptables -t nat -C POSTROUTING -s \"$TUN_POOL\" !\
    \ -o \"$TUN_DEV\" -j MASQUERADE 2>/dev/null \\\n  || iptables -t nat -A POSTROUTING -s \"$TUN_POOL\" ! -o \"$TUN_DEV\"\
    \ -j MASQUERADE\niptables -P FORWARD ACCEPT\necho \"upf-entrypoint: $TUN_DEV up, gateway $TUN_GATEWAY, NAT for $TUN_POOL,\
    \ config $UPF_CONFIG\"\n\n# Per-slice traffic exporter on :9120. It runs HERE, not as a sidecar: the TUN device exists\n\
    # only in this container's network namespace, and a sidecar that shares a namespace is\n# stranded in a dead one when\
    \ this container restarts \u2014 Docker then gave up restarting it.\n( while true; do python3 -u /opt/o5gs-obs/upf_slice_exporter.py;\
    \ sleep 2; done ) &\n\nexec open5gs-upfd -c \"$UPF_CONFIG\"\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o5gs-prometheus
  namespace: o5gs
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\n  external_labels:\n    deployment: open5gs\n\
    scrape_configs:\n- job_name: open5gs\n  static_configs:\n  - targets:\n    - amf.o5gs.svc.cluster.local:9090\n    labels:\n\
    \      nf: amf\n  - targets:\n    - smf.o5gs.svc.cluster.local:9090\n    labels:\n      nf: smf\n  - targets:\n    - upf-embb.o5gs.svc.cluster.local:9090\n\
    \    labels:\n      nf: upf\n      slice: eMBB\n  - targets:\n    - upf-urllc.o5gs.svc.cluster.local:9090\n    labels:\n\
    \      nf: upf\n      slice: URLLC\n  - targets:\n    - upf-mmtc.o5gs.svc.cluster.local:9090\n    labels:\n      nf: upf\n\
    \      slice: mMTC\n  - targets:\n    - pcf.o5gs.svc.cluster.local:9090\n    labels:\n      nf: pcf\n- job_name: upf-slice-traffic\n\
    \  static_configs:\n  - targets:\n    - upf-embb.o5gs.svc.cluster.local:9120\n    - upf-urllc.o5gs.svc.cluster.local:9120\n\
    \    - upf-mmtc.o5gs.svc.cluster.local:9120\n    labels:\n      component: upf-slice-exporter\n- job_name: ue-probe\n\
    \  static_configs:\n  - targets:\n    - ue.o5gs.svc.cluster.local:9121\n    labels:\n      component: ue-probe-exporter\n\
    - job_name: kpi-traffic\n  static_configs:\n  - targets:\n    - dn-urllc.o5gs.svc.cluster.local:9130\n    labels:\n  \
    \    component: kpi-collector\n  - targets:\n    - dn-mmtc.o5gs.svc.cluster.local:9130\n    labels:\n      component:\
    \ kpi-collector\n  - targets:\n    - ue.o5gs.svc.cluster.local:9122\n    labels:\n      component: traffic-agent\n- job_name:\
    \ prometheus\n  static_configs:\n  - targets:\n    - localhost:9090\n"
