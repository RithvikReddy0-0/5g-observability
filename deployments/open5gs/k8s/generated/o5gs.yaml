  ue-entrypoint.sh: "#!/bin/sh\n# ue-entrypoint.sh \u2014 run and SUPERVISE the 20 UEs as this container's own workload.\n\
    #\n# WHY THE UEs LIVE HERE AND NOT IN `docker exec`\n# The Docker engine on this host runs inside the Ubuntu WSL distro,\
    \ and WSL shuts that distro\n# down \u2014 engine included \u2014 soon after the last terminal closes (docs/open5gs.md,\
    \ \"Engine\n# restarts\"). restart: unless-stopped brings every container back, but processes started\n# with `docker\
    \ exec` are not part of a container's definition and are simply gone. Launched\n# from the entrypoint, the UEs come back\
    \ with the container. No re-provisioning is needed:\n# when a UE's SQN is out of step, Open5GS completes AUTS resynchronisation\
    \ on the retry.\n#\n# WHY ONE nr-ue PROCESS PER UE, AND WHY SUPERVISED\n# UERANSIM declares radio link failure when a\
    \ UE hears nothing from the gNB for 2 s\n# (HEARTBEAT_THRESHOLD in src/ue/rls/udp_task.cpp) \u2014 any 2-second stall\
    \ of the simulator is\n# enough. The UE then recovers its registration with a Service Request, but its user plane\n# does\
    \ not come back: the gNB logs \"Uplink data failure, PDU session not found\" for every\n# packet, while the UE still shows\
    \ CM-CONNECTED and the core still counts the session.\n# Observed for 3 of 20 UEs within 20 minutes; only probing from\
    \ the UE side revealed it.\n#\n# So each UE is its own process (`nr-ue -i <imsi>`), and every CHECK_EVERY seconds each\
    \ one\n# pings its slice's UPF gateway through its own interface. A UE that fails CHECK_STRIKES\n# checks in a row is\
    \ restarted on its own \u2014 the other 19 are untouched.\n#\n# UEs are started ONE AT A TIME: nr-ue takes the next free\
    \ uesimtunN name, and processes\n# starting together race for the same name (\"TUNSETIFF: Device or resource busy\").\n\
    set -u\n\nN=\"${UES_PER_SLICE:-10}\"\nCFG=/etc/ueransim\nCHECK_EVERY=\"${CHECK_EVERY:-10}\"\nCHECK_STRIKES=\"${CHECK_STRIKES:-3}\"\
    \nSTART_WAIT=\"${UE_START_WAIT:-30}\"\nSTATE=/tmp/ues\nmkdir -p \"$STATE\"\n\n# Slice plan: <config>:<first imsi>:<gateway>:<name>.\
    \ Matches deployments/slices.env and the\n# address pools in config/smf.yaml.\nSLICES=\"ue-slice-a.yaml:208930000000001:10.45.0.1:eMBB\
    \ ue-slice-b.yaml:208930000000011:10.46.0.1:URLLC\"\n\nlog() { echo \"ue-entrypoint: $*\"; }\n\n# Per-slice reachability/latency\
    \ exporter on :9121, measured from these UEs' own interfaces.\n# Runs here rather than as a sidecar: a sidecar sharing\
    \ this network namespace is stranded\n# in a dead one when this container restarts. Respawned if it ever exits.\n( while\
    \ true; do python3 -u /opt/o5gs-obs/ue_probe_exporter.py; sleep 2; done ) &\n\nif [ \"$N\" -le 0 ]; then\n  log \"UES_PER_SLICE=0,\
    \ idling\"; exec sleep infinity\nfi\n\n# A UE is identified by its PDU-session ADDRESS, never by its interface NAME. Names\
    \ are reused:\n# when a session drops, its uesimtunN is destroyed and the next session anywhere may take the\n# same name.\
    \ Checking by name once marked two dead UEs healthy \u2014 their logs named an interface\n# that now belonged to another\
    \ UE, and pings through it succeeded. Addresses are allocated\n# uniquely by the SMF, so an address can only ever mean\
    \ one live session.\nip_of() {    # <imsi> -> the UE's latest session address from its own log, or empty\n  sed -n 's/.*TUN\
    \ interface\\[uesimtun[0-9]*, \\([0-9.]*\\)\\].*/\\1/p' \"/tmp/ue-$1.log\" 2>/dev/null | tail -1\n}\n\ntun_of() {   #\
    \ <imsi> -> the interface CURRENTLY holding that UE's address, or empty\n  a=$(ip_of \"$1\")\n  [ -n \"$a\" ] || return\
    \ 0\n  ip -4 -o addr show 2>/dev/null | awk -v a=\"$a\" '/uesimtun/ { split($4, p, \"/\"); if (p[1] == a) { print $2;\
    \ exit } }'\n}\n\nstart_ue() {   # <imsi> <config>\n  : > \"/tmp/ue-$1.log\"\n  nr-ue -c \"$CFG/$2\" -i \"imsi-$1\" >>\
    \ \"/tmp/ue-$1.log\" 2>&1 &\n  echo $! > \"$STATE/$1.pid\"\n  echo 0 > \"$STATE/$1.strikes\"\n  # Wait for this UE's interface\
    \ before starting the next one (TUN name race).\n  w=0\n  while [ \"$w\" -lt \"$START_WAIT\" ]; do\n    [ -n \"$(tun_of\
    \ \"$1\")\" ] && return 0\n    kill -0 \"$(cat \"$STATE/$1.pid\")\" 2>/dev/null || return 1\n    w=$((w + 1)); sleep 1\n\
    \  done\n  return 1\n}\n\nstop_ue() {   # <imsi>\n  pid=$(cat \"$STATE/$1.pid\" 2>/dev/null)\n  [ -n \"$pid\" ] || return\
    \ 0\n  kill \"$pid\" 2>/dev/null\n  for _ in 1 2 3 4 5; do kill -0 \"$pid\" 2>/dev/null || return 0; sleep 1; done\n \
    \ kill -9 \"$pid\" 2>/dev/null\n}\n\nplan() {   # every UE, one per line: <imsi> <config> <gateway> <slice>\n  for s in\
    \ $SLICES; do\n    cfg=${s%%:*}; rest=${s#*:}; first=${rest%%:*}; rest=${rest#*:}; gw=${rest%%:*}; name=${rest#*:}\n \
    \   k=0\n    while [ \"$k\" -lt \"$N\" ]; do\n      echo \"$((first + k)) $cfg $gw $name\"\n      k=$((k + 1))\n    done\n\
    \  done\n}\n\nlog \"starting $N UEs per slice, one process each\"\nplan | while read -r imsi cfg gw name; do\n  if start_ue\
    \ \"$imsi\" \"$cfg\"; then log \"$name imsi-$imsi up on $(tun_of \"$imsi\")\"\n  else log \"$name imsi-$imsi did not come\
    \ up within ${START_WAIT}s; the supervisor will retry\"; fi\ndone\n\nlog \"supervising: ping each UE's gateway every ${CHECK_EVERY}s,\
    \ restart after ${CHECK_STRIKES} misses\"\nwhile true; do\n  sleep \"$CHECK_EVERY\"\n  plan | while read -r imsi cfg gw\
    \ name; do\n    pid=$(cat \"$STATE/$imsi.pid\" 2>/dev/null)\n    t=$(tun_of \"$imsi\")\n    if ! kill -0 \"$pid\" 2>/dev/null;\
    \ then\n      reason=\"process exited\"\n    elif [ -z \"$t\" ]; then\n      reason=\"its session address $(ip_of \"$imsi\"\
    ) is on no interface\"\n    elif ping -I \"$t\" -c 1 -W 2 \"$gw\" >/dev/null 2>&1; then\n      echo 0 > \"$STATE/$imsi.strikes\"\
    ; continue\n    else\n      reason=\"no reply through the UPF on $t ($(ip_of \"$imsi\"))\"\n    fi\n    s=$(( $(cat \"\
    $STATE/$imsi.strikes\" 2>/dev/null || echo 0) + 1 ))\n    echo \"$s\" > \"$STATE/$imsi.strikes\"\n    if [ \"$s\" -ge\
    \ \"$CHECK_STRIKES\" ]; then\n      log \"$name imsi-$imsi unhealthy ($reason, $s checks): restarting this UE only\"\n\
    \      echo \"$(date -u +%Y-%m-%dT%H:%M:%SZ) imsi-$imsi $name $reason\" >> \"$STATE/restarts.log\"\n      stop_ue \"$imsi\"\
    \n      if start_ue \"$imsi\" \"$cfg\"; then log \"$name imsi-$imsi back on $(tun_of \"$imsi\")\"\n      else log \"$name\
    \ imsi-$imsi restart did not complete; will retry\"; fi\n    fi\n  done\ndone\n"
