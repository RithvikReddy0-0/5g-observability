apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: o5gs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: o5gs
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - name: tcp-27017
    port: 27017
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: o5gs
  labels:
    app: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
        imagePullPolicy: IfNotPresent
        args:
        - mongod
        - --bind_ip
        - 0.0.0.0
        volumeMounts:
        - name: data
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - mongo
            - --quiet
            - --eval
            - db.runCommand({ping:1}).ok
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mongodb-data
---
apiVersion: v1
