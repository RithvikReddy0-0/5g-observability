        - sed "s/POD_IP/$POD_IP/g" /etc/ueransim/gnb-urllc.yaml > /tmp/gnb.yaml && exec sh /etc/ueransim/gnb-entrypoint.sh
          /tmp/gnb.yaml
        env:
        - name: UERANSIM_UDP_BUFFER_BYTES
          value: '8388608'
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: ran
          mountPath: /etc/ueransim
      volumes:
      - name: ran
        configMap:
          name: o5gs-ran
      initContainers:
      - name: wait-for-peers
        image: o5gs/ueransim:v3.3.0-udpbuf-mono
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - for n in amf.o5gs.svc.cluster.local; do until getent hosts $n >/dev/null; do echo waiting for $n; sleep 2; done;
          done
