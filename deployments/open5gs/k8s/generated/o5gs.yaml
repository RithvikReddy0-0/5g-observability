  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nrf
  template:
    metadata:
      labels:
        app: nrf
    spec:
      containers:
      - name: nrf
        image: o5gs/open5gs:v2.8.0
        imagePullPolicy: Never
        command:
        - open5gs-nrfd
        - -c
        - /etc/open5gs/nrf.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/open5gs
      volumes:
      - name: config
        configMap:
          name: o5gs-config
      initContainers:
      - name: wait-for-peers
        image: o5gs/open5gs:v2.8.0
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        - for n in mongodb.o5gs.svc.cluster.local; do until getent hosts $n >/dev/null; do echo waiting for $n; sleep 2; done;
          done
