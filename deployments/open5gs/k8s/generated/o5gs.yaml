  ue-entrypoint.sh: "#!/bin/sh\n# ue-entrypoint.sh \u2014 run and SUPERVISE the UEs (Phase 2b: 100) as this container's own\
    \ workload.\n#\n# WHY THE UEs LIVE HERE AND NOT IN `docker exec`\n# The Docker engine on this host runs inside the Ubuntu\
    \ WSL distro, and WSL shuts that distro\n# down \u2014 engine included \u2014 soon after the last terminal closes (docs/open5gs.md,\
    \ \"Engine\n# restarts\"). restart: unless-stopped brings every container back, but processes started\n# with `docker\
    \ exec` are not part of a container's definition and are simply gone. Launched\n# from the entrypoint, the UEs come back\
    \ with the container. No re-provisioning is needed:\n# when a UE's SQN is out of step, Open5GS completes AUTS resynchronisation\
    \ on the retry.\n#\n# WHY ONE nr-ue PROCESS PER UE, AND WHY SUPERVISED\n# UERANSIM declares radio link failure when a\
    \ UE hears nothing from the gNB for 2 s\n# (HEARTBEAT_THRESHOLD in src/ue/rls/udp_task.cpp). The UE then recovers its\
    \ registration with\n# a Service Request, but its user plane does not come back: the gNB logs \"Uplink data failure,\n\
    # PDU session not found\" for every packet, while the UE still shows CM-CONNECTED and the core\n# still counts the session.\
    \ Only probing from the UE side reveals it.\n#\n# So each UE is its own process (`nr-ue -i <imsi>`), and every CHECK_EVERY\
    \ seconds each one\n# pings its slice's UPF gateway through its own interface. A UE that fails CHECK_STRIKES\n# checks\
    \ in a row is restarted on its own \u2014 every other UE is untouched.\n#\n# WHY UEs CAN START IN PARALLEL (ADR-014)\n\
    # nr-ue names its interface <prefix><first free index>, and picks a policy-routing table id by\n# reading /etc/iproute2/rt_tables\
    \ and appending the first free one. With a shared prefix, UEs\n# starting together raced for the same interface name (\"\
    TUNSETIFF: Device or resource busy\"),\n# so 20 UEs were started one at a time. For 100 that is minutes after every engine\
    \ restart.\n# Now every UE gets its OWN interface prefix (tunName, from its IMSI) and its routing table is\n# registered\
    \ here, with a unique id, before any UE starts.\n# A third shared thing: every nr-ue registers itself in /tmp/UERANSIM.proc-table/\
    \ (for nr-cli),\n# creating the directory if it is missing \u2014 check, then mkdir, and a hard failure on EEXIST\n# (io::CreateDirectory).\
    \ On a fresh container the first UEs to start together raced for it and\n# the losers ABORTED (\"could not be created:\
    \ File exists\"): 8 of 25 in one burst. The directory is\n# created here first, so nothing is left to race for.\n# START_BATCH\
    \ UEs are started at once; START_BATCH=1 restores one at a time.\nset -u\n\nCFG=/etc/ueransim\nRUN=/tmp/ue-cfg\nCHECK_EVERY=\"\
    ${CHECK_EVERY:-10}\"\nCHECK_STRIKES=\"${CHECK_STRIKES:-3}\"\nSTART_WAIT=\"${UE_START_WAIT:-60}\"\nSTART_BATCH=\"${START_BATCH:-10}\"\
    \nFIRST_IMSI=\"${FIRST_IMSI:-208930000000001}\"\nSTATE=/tmp/ues\nmkdir -p \"$STATE\" \"$RUN\"\nrm -f \"$STATE/startup\"\
    \     # /tmp survives a container restart; a stale record would look like this start\nmkdir -p /tmp/UERANSIM.proc-table\
    \ && chmod 777 /tmp/UERANSIM.proc-table   # see \"a third shared thing\"\n\n# Slice plan, in IMSI order: <config>:<UEs>:<gateway>:<name>.\
    \ IMSIs are assigned contiguously\n# from FIRST_IMSI in this order \u2014 the same rule as scripts/open5gs/provision_subscribers.py,\
    \ and\n# the counts must equal O5GS_UES in deployments/slices.env (tools/check_open5gs_slices.py).\nUE_PLAN=\"${UE_PLAN:-ue-slice-a.yaml:20:10.45.0.1:eMBB\
    \ ue-slice-b.yaml:10:10.46.0.1:URLLC ue-slice-c.yaml:70:10.47.0.1:mMTC}\"\n\n# A measurement run may change the plan without\
    \ recreating this container \u2014 which needs `docker\n# compose`, not always available on this host. scripts/open5gs/scale_test.sh\
    \ and\n# tools/kpi/run_kpis.py write UE_PLAN= / START_BATCH= lines here, restart the container, and\n# delete the file\
    \ (and restart again) to restore the plan above.\nif [ -f /tmp/ue-plan.override ]; then\n  # shellcheck disable=SC1091\n\
    \  . /tmp/ue-plan.override\n  echo \"ue-entrypoint: plan overridden for this run by /tmp/ue-plan.override\"\nfi\n\nlog()\
    \ { echo \"ue-entrypoint: $(date -u +%H:%M:%S) $*\"; }\n\n# Per-slice reachability/latency exporter on :9121, measured\
    \ from these UEs' own interfaces.\n# Runs here rather than as a sidecar: a sidecar sharing this network namespace is stranded\n\
    # in a dead one when this container restarts. Respawned if it ever exits.\n( while true; do python3 -u /opt/o5gs-obs/ue_probe_exporter.py;\
    \ sleep 2; done ) &\n\n# The URLLC and mMTC devices' own traffic (ADR-015): small periodic packets from each UE's own\n\
    # address to its slice's data network, where kpi_collector.py measures latency and loss. It finds\n# the UEs itself and\
    \ follows them across restarts. Metrics on :9122.\n( while true; do python3 -u /opt/o5gs-obs/traffic_agent.py; sleep 2;\
    \ done ) &\n\nplan() {   # every UE, one per line: <imsi> <config> <gateway> <slice>\n  imsi=$FIRST_IMSI\n  for s in $UE_PLAN;\
    \ do\n    cfg=${s%%:*}; rest=${s#*:}; n=${rest%%:*}; rest=${rest#*:}; gw=${rest%%:*}; name=${rest#*:}\n    k=0\n    while\
    \ [ \"$k\" -lt \"$n\" ]; do\n      echo \"$imsi $cfg $gw $name\"\n      imsi=$((imsi + 1)); k=$((k + 1))\n    done\n \
    \ done\n}\n\ntotal=$(plan | wc -l)\nif [ \"$total\" -le 0 ]; then\n  log \"UE_PLAN is empty, idling\"; exec sleep infinity\n\
    fi\n\ntag_of() { printf '%04d' $(( $1 % 10000 )); }   # <imsi> -> its last four digits\n\n# Each UE's own interface prefix,\
    \ \"uesimtun\" + the last four digits of its IMSI (UERANSIM allows\n# 12 characters). Its one session is then uesimtun<NNNN>0\
    \ \u2014 still matched by every tool that\n# looks for \"uesimtun\" \u2014 and no prefix is the start of another, so no\
    \ two UEs can collide.\n# The routing table nr-ue will ask for is rt_<interface>; give each a unique id up front, from\n\
    # 2000 up \u2014 nr-ue itself allocates from 1000, so an entry left by an older run cannot collide.\nplan | while read\
    \ -r imsi cfg gw name; do\n  t=$(tag_of \"$imsi\")\n  { cat \"$CFG/$cfg\"; echo; echo \"tunName: \\\"uesimtun$t\\\"\"\
    ; } > \"$RUN/$imsi.yaml\"\n  grep -q \"[[:space:]]rt_uesimtun${t}0\\$\" /etc/iproute2/rt_tables 2>/dev/null \\\n    ||\
    \ printf '%d\\trt_uesimtun%s0\\n' $(( 2000 + imsi % 10000 )) \"$t\" >> /etc/iproute2/rt_tables\ndone\n\n# A UE is identified\
    \ by its PDU-session ADDRESS, never by its interface NAME. With the old shared\n# prefix, names were reused after a session\
    \ dropped, and checking by name once marked two dead\n# UEs healthy. Addresses are allocated uniquely by the SMF, so an\
    \ address can only ever mean one\n# live session; with per-UE prefixes this is now doubly safe.\nip_of() {    # <imsi>\
    \ -> the UE's latest session address from its own log, or empty\n  sed -n 's/.*TUN interface\\[uesimtun[0-9]*, \\([0-9.]*\\\
    )\\].*/\\1/p' \"/tmp/ue-$1.log\" 2>/dev/null | tail -1\n}\n\ntun_of() {   # <imsi> -> the interface CURRENTLY holding\
    \ that UE's address, or empty\n  a=$(ip_of \"$1\")\n  [ -n \"$a\" ] || return 0\n  ip -4 -o addr show 2>/dev/null | awk\
    \ -v a=\"$a\" '/uesimtun/ { split($4, p, \"/\"); if (p[1] == a) { print $2; exit } }'\n}\n\nlaunch_ue() {   # <imsi>:\
    \ start it, do not wait\n  : > \"/tmp/ue-$1.log\"\n  nr-ue -c \"$RUN/$1.yaml\" -i \"imsi-$1\" < /dev/null >> \"/tmp/ue-$1.log\"\
    \ 2>&1 &\n  echo $! > \"$STATE/$1.pid\"\n  echo 0 > \"$STATE/$1.strikes\"\n}\n\nwait_up() {     # <imsi>...: wait until\
    \ each has its interface, has died, or START_WAIT passes\n  w=0\n  while [ \"$w\" -lt \"$START_WAIT\" ]; do\n    pending=0\n\
    \    for i in \"$@\"; do\n      [ -n \"$(tun_of \"$i\")\" ] && continue\n      kill -0 \"$(cat \"$STATE/$i.pid\")\" 2>/dev/null\
    \ && pending=$((pending + 1))\n    done\n    [ \"$pending\" -eq 0 ] && return 0\n    w=$((w + 1)); sleep 1\n  done\n}\n\
    \nstop_ue() {   # <imsi>\n  pid=$(cat \"$STATE/$1.pid\" 2>/dev/null)\n  [ -n \"$pid\" ] || return 0\n  kill \"$pid\" 2>/dev/null\n\
    \  for _ in 1 2 3 4 5; do kill -0 \"$pid\" 2>/dev/null || return 0; sleep 1; done\n  kill -9 \"$pid\" 2>/dev/null\n}\n\
    \nlog \"starting $total UEs ($UE_PLAN), $START_BATCH at a time\"\nstarted=$(date +%s)\nplan > \"$STATE/plan\"\nbatch=\"\
    \"\nn=0\nwhile read -r imsi cfg gw name; do\n  launch_ue \"$imsi\"\n  batch=\"$batch $imsi\"; n=$((n + 1))\n  if [ \"\
    $n\" -ge \"$START_BATCH\" ]; then\n    # shellcheck disable=SC2086\n    wait_up $batch; batch=\"\"; n=0\n  fi\ndone <\
    \ \"$STATE/plan\"\n# shellcheck disable=SC2086\n[ -n \"$batch\" ] && wait_up $batch\n\nup=0\nwhile read -r imsi cfg gw\
    \ name; do\n  if [ -n \"$(tun_of \"$imsi\")\" ]; then up=$((up + 1))\n  else log \"$name imsi-$imsi did not come up within\
    \ ${START_WAIT}s; the supervisor will retry\"; fi\ndone < \"$STATE/plan\"\nlog \"$up/$total UEs up in $(( $(date +%s)\
    \ - started ))s\"\necho \"$up $total $(( $(date +%s) - started )) $START_BATCH\" > \"$STATE/startup\"\n\nlog \"supervising:\
    \ ping each UE's gateway every ${CHECK_EVERY}s, restart after ${CHECK_STRIKES} misses\"\nwhile true; do\n  sleep \"$CHECK_EVERY\"\
    \n  while read -r imsi cfg gw name; do\n    pid=$(cat \"$STATE/$imsi.pid\" 2>/dev/null)\n    t=$(tun_of \"$imsi\")\n \
    \   if ! kill -0 \"$pid\" 2>/dev/null; then\n      reason=\"process exited\"\n    elif [ -z \"$t\" ]; then\n      reason=\"\
    its session address $(ip_of \"$imsi\") is on no interface\"\n    elif ping -I \"$t\" -c 1 -W 2 \"$gw\" >/dev/null 2>&1;\
    \ then\n      echo 0 > \"$STATE/$imsi.strikes\"; continue\n    else\n      reason=\"no reply through the UPF on $t ($(ip_of\
    \ \"$imsi\"))\"\n    fi\n    s=$(( $(cat \"$STATE/$imsi.strikes\" 2>/dev/null || echo 0) + 1 ))\n    echo \"$s\" > \"\
    $STATE/$imsi.strikes\"\n    if [ \"$s\" -ge \"$CHECK_STRIKES\" ]; then\n      log \"$name imsi-$imsi unhealthy ($reason,\
    \ $s checks): restarting this UE only\"\n      echo \"$(date -u +%Y-%m-%dT%H:%M:%SZ) imsi-$imsi $name $reason\" >> \"\
    $STATE/restarts.log\"\n      stop_ue \"$imsi\"\n      launch_ue \"$imsi\"\n      wait_up \"$imsi\"\n      if [ -n \"$(tun_of\
    \ \"$imsi\")\" ]; then log \"$name imsi-$imsi back on $(tun_of \"$imsi\")\"\n      else log \"$name imsi-$imsi restart\
    \ did not complete; will retry\"; fi\n    fi\n  done < \"$STATE/plan\"\ndone\n"
  gnb-entrypoint.sh: "#!/bin/sh\n# gnb-entrypoint.sh <config> \u2014 run one UERANSIM gNB, and exit when its N2 link to the\
    \ AMF is down,\n# so that Docker (restart: unless-stopped) or Kubernetes (restartPolicy: Always) starts a fresh one.\n\
    #\n# WHY: UERANSIM v3.3.0's gNB connects to the AMF once. A refused connection is logged\n# (\"Connecting to ... failed\"\
    , src/gnb/sctp/task.cpp) and never retried; an association that\n# ends later is dropped without reconnecting (handleAssociationShutdown,\
    \ src/gnb/ngap/\n# interface.cpp). The process stays up either way, with its cell barred.\n# After a Docker engine restart\
    \ every container starts at once: two of the three gNBs reached the\n# AMF before it listened, logged \"Connection refused\"\
    \ and stayed like that \u2014 80 of 100 UEs could\n# not attach, and nothing restarted them (ADR-014).\n#\n# So: no NG\
    \ Setup within NG_SETUP_WAIT seconds, or \"Association terminated\" later -> exit 1.\nset -u\n\nCFG=\"$1\"\nWAIT=\"${NG_SETUP_WAIT:-30}\"\
    \nLOG=/tmp/gnb.log\n: > \"$LOG\"\n\nnr-gnb -c \"$CFG\" < /dev/null > \"$LOG\" 2>&1 &\nPID=$!\ntail -n +1 -F \"$LOG\" 2>/dev/null\
    \ &     # keep the gNB's own output in `docker logs`\nTAIL=$!\n\nsay()  { echo \"gnb-entrypoint: $*\"; }\nstop() { kill\
    \ \"$PID\" 2>/dev/null; wait \"$PID\" 2>/dev/null; kill \"$TAIL\" 2>/dev/null; }\ntrap 'stop; exit 143' TERM INT\n\nw=0\n\
    until grep -q \"NG Setup procedure is successful\" \"$LOG\"; do\n  if ! kill -0 \"$PID\" 2>/dev/null; then say \"nr-gnb\
    \ exited before NG Setup\"; stop; exit 1; fi\n  if [ \"$w\" -ge \"$WAIT\" ]; then\n    say \"no NG Setup with the AMF\
    \ within ${WAIT}s \u2014 exiting so this gNB is restarted\"; stop; exit 1\n  fi\n  w=$((w + 1)); sleep 1\ndone\nsay \"\
    NG Setup done; watching the N2 association\"\n\n# Only the recent end of the log is searched: it grows with every UE event.\n\
    while kill -0 \"$PID\" 2>/dev/null; do\n  if tail -c 65536 \"$LOG\" | grep -q \"Association terminated\"; then\n    say\
    \ \"N2 association to the AMF lost \u2014 exiting so this gNB is restarted\"; stop; exit 1\n  fi\n  sleep 2\ndone\nsay\
    \ \"nr-gnb exited\"; stop; exit 1\n"
