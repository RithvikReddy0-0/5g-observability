        - /bin/sh
        - -c
        - for n in gnb-embb.o5gs.svc.cluster.local gnb-mmtc.o5gs.svc.cluster.local gnb-urllc.o5gs.svc.cluster.local; do until
          getent hosts $n >/dev/null; do echo waiting for $n; sleep 2; done; done
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: o5gs
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: o5gs
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=2d
        volumeMounts:
        - name: cfg
          mountPath: /etc/prometheus
      volumes:
      - name: cfg
        configMap:
          name: o5gs-prometheus
