# Open5GS v2.8.0 — NSSF
# Generated from deployments/slices.env by the Open5GS migration; edit slices.env for slice
# changes. Addresses follow the static plan in deployments/open5gs/docker-compose.yaml.
# No logger.file: NFs log to stdout so `docker logs` is the single log source.

logger:
  level: info

global:
  max:
    ue: 1024

# One NSI per slice. Both point at the single NRF: slice isolation here is at the QoS and
# user-plane pool level, not separate NF instances.
nssf:
  sbi:
    server:
      - address: 10.53.0.14
        port: 7777
    client:
      scp:
        - uri: http://10.53.0.200:7777
      nsi:
        - uri: http://10.53.0.10:7777
          s_nssai:
            sst: 1
            sd: "010203"
        - uri: http://10.53.0.10:7777
          s_nssai:
            sst: 2
            sd: "112233"
