# Open5GS v2.8.0 — AMF
# Generated from deployments/slices.env by the Open5GS migration; edit slices.env for slice
# changes. Addresses follow the static plan in deployments/open5gs/docker-compose.yaml.
# No logger.file: NFs log to stdout so `docker logs` is the single log source.

logger:
  level: info

global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: 10.53.0.5
        port: 7777
    client:
      scp:
        - uri: http://10.53.0.200:7777
  ngap:
    server:
      - address: 10.53.0.5
  metrics:
    server:
      - address: 10.53.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: 208
        mnc: 93
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 208
        mnc: 93
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 208
        mnc: 93
      s_nssai:
        - sst: 1
          sd: "010203"
        - sst: 2
          sd: "112233"
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: O5GS-Observability-Lab
    short: O5GS
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
