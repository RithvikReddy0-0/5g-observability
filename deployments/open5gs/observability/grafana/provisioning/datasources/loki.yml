# Takes effect when Grafana restarts.
apiVersion: 1
datasources:
  - name: Loki-Open5GS
    uid: loki-o5gs
    type: loki
    access: proxy
    url: http://10.53.0.43:3100
    isDefault: false
    jsonData:
      maxLines: 1000
