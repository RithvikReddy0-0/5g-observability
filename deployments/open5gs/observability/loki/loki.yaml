# Loki for the Open5GS stack's logs (ADR-024): single binary, filesystem storage, 72 h retention.
# Based on the upstream cmd/loki/loki-docker-config.yaml of the pinned version (3.7.8), cut down for a
# laptop that also runs 100 UEs: small query cache, no pattern ingester, no ruler, no usage reports.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_label_names_per_series: 10

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16

analytics:
  reporting_enabled: false
