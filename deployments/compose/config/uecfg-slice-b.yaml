# UERANSIM UE config — PHASE 1.5 SLICE B.
#
# Identical to uecfg.yaml except for the starting SUPI and the requested S-NSSAI, so the
# two UE groups differ only by slice. Launched with `nr-ue -n 10`, this covers
# imsi-208930000000011 .. imsi-208930000000020, which scripts/provision_subscribers.sh
# provisions on slice B (SST 1 / SD 112233).
#
# The requested NSSAI must match what the subscriber is provisioned for: asking for a slice
# the subscriber does not have makes the AMF treat the NSSAI as unservable and fail with
# "AMF can not select an target AMF by NRF".

# IMSI number of the UE. IMSI = [MCC|MNC|MSISDN] (In total 15 digits)
supi: "imsi-208930000000011"
# Mobile Country Code value of HPLMN
mcc: "208"
# Mobile Network Code value of HPLMN (2 or 3 digits)
mnc: "93"

# Permanent subscription key
key: "8baf473f2f8fd09487cccbd7097c6862"
# Operator code (OP or OPC) of the UE
op: "8e27b6af0e692e750f32667a3b14605d"
# This value specifies the OP type and it can be either 'OP' or 'OPC'
opType: "OPC"
# Authentication Management Field (AMF) value
amf: "8000"
# IMEI number of the device. It is used if no SUPI is provided
imei: "356938035643803"
# IMEISV number of the device. It is used if no SUPI and IMEI is provided
imeiSv: "4370816125816151"

# List of gNB IP addresses for Radio Link Simulation
gnbSearchList:
  - 127.0.0.1
  - gnb.free5gc.org

# UAC Access Identities Configuration
uacAic:
  mps: false
  mcs: false

# UAC Access Control Class
uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

# Initial PDU sessions to be established — SLICE B
sessions:
  - type: "IPv4"
    apn: "internet"
    slice:
      sst: 0x01
      sd: 0x112233

# Configured NSSAI for this UE by HPLMN
configured-nssai:
  - sst: 0x01
    sd: 0x112233

# Default Configured NSSAI for this UE
default-nssai:
  - sst: 0x01
    sd: 0x112233

# Supported integrity algorithms by this UE
integrity:
  IA1: true
  IA2: true
  IA3: true

# Supported encryption algorithms by this UE
ciphering:
  EA1: true
  EA2: true
  EA3: true

# Integrity protection maximum data rate for user plane
integrityMaxRate:
  uplink: "full"
  downlink: "full"
